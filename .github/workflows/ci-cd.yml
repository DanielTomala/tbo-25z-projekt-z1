name: CI-CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

env:
  APP_DIR: Flask_Book_Library
  IMAGE_NAME: tbo-25z-projekt-z1
  REGISTRY: ghcr.io

jobs:
  test_scan_build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag (latest on main, beta otherwise)
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=beta" >> $GITHUB_ENV
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies + test/security tools
        run: |
          python -m pip install --upgrade pip
          pip install -r "${APP_DIR}/requirements.txt"
          pip install pytest bandit

      # 1) Unit tests
      - name: Unit tests (pytest)
        working-directory: ${{ env.APP_DIR }}
        env:
          PYTHONPATH: .
        run: |
          pytest -q

      # 2) SAST
      - name: SAST (Bandit)
        run: |
          bandit -r "${APP_DIR}" -ll

      # 3) SCA (OWASP Dependency-Check)
      - name: SCA (OWASP Dependency-Check)
        id: depcheck
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: ${{ env.IMAGE_NAME }}
          path: ${{ env.APP_DIR }}
          format: "HTML"
          out: "reports"
          args: >
            --failOnCVSS 7

      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports

      # 4) DAST (start app locally, then scan)
      - name: Start app (for DAST)
        run: |
          cd "${APP_DIR}"
          python app.py &
          sleep 10
          curl -fsS "http://127.0.0.1:5000/" >/dev/null

      - name: DAST (OWASP ZAP Baseline)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://127.0.0.1:5000"
          rules_file_name: ".zap/rules.tsv"
          fail_action: true
          allow_issue_writing: false

      # 5) Build & push image (skip push on PR)
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set registry owner (lowercase for GHCR)
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          file: ${{ env.APP_DIR }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

